version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      pytorch:
        patterns: ["torch", "torchvision", "timm", "onnx*"]
  - package-ecosystem: pip
    directory: /demo
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directories: ["/", "/demo"]
    schedule:
      interval: weekly
