# Local stack: PostgreSQL + inference API + Streamlit demo, with fictitious demo data.
# Usage: cp .env.example .env (fill the values) && docker compose up --build
name: vision-defectos-tela

services:
  db:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_DB: fabric
      POSTGRES_USER: fabric
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fabric -d fabric"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    image: vision-defectos-tela-api:1.0.0
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://fabric:${POSTGRES_PASSWORD}@db:5432/fabric
      API_KEYS: ${API_KEYS:?Define API_KEYS in .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      MM_PER_PIXEL: ${MM_PER_PIXEL:-0.1}
      MAX_POINTS_PER_100_SQ_YD: ${MAX_POINTS_PER_100_SQ_YD:-40}
      ENABLE_DOCS: ${ENABLE_DOCS:-true}
      MODEL_BASE_URL: ${MODEL_BASE_URL:-}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      # ONNX files from `fabric-inspection reproduce`; if absent they are downloaded from the
      # GitHub Release into the cache volume (verified by SHA-256).
      - ./models:/app/models:ro
      - model-cache:/app/.cache/models
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  demo:
    image: vision-defectos-tela-demo:1.0.0
    build:
      context: .
      dockerfile: demo/Dockerfile
    environment:
      API_BASE_URL: http://api:8000
      API_KEY: ${DEMO_API_KEY:?Define DEMO_API_KEY in .env (one of API_KEYS)}
    ports:
      - "127.0.0.1:8501:8501"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  model-cache:
